[package]
name = "zapret-plugin"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
jarvis-plugin-sdk = { path = "sdk", features = ["process"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", default-features = false, features = ["rt", "io-std", "io-util", "macros", "process"] }

# Компактная сборка для маленького раздела /data колонки.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"